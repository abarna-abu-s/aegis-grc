# Render Blueprint: free web service + free Postgres. See README for caveats (free tier sleeps; free Postgres expires after 30 days).
services:
  - type: web
    name: aegis-grc
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: aegis-db
          property: connectionString
      - key: AUTO_CREATE_SCHEMA
        value: "true"
      - key: UPLOAD_DIR
        value: /tmp/uploads   # ephemeral on the free tier: uploaded files are lost on restart
      - key: AI_PROVIDER
        value: none
databases:
  - name: aegis-db
    plan: free
