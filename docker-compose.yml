services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aegis_grc
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdev_change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis -d aegis_grc"]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://aegis:${POSTGRES_PASSWORD:-localdev_change_me}@db:5432/aegis_grc
      JWT_SECRET: ${JWT_SECRET:-change-this-local-demo-secret-before-deploying}
      ACCESS_TOKEN_MINUTES: 720
      UPLOAD_DIR: /app/uploads
      CORS_ORIGINS: http://localhost:8000
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
  uploads_data:
